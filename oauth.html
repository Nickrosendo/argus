<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>OAuth Redirect - Argus</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            background: #1e1b4b;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .container {
            max-width: 400px;
            padding: 20px;
        }
        .logo {
            width: 64px;
            height: 64px;
            margin-bottom: 20px;
        }
        .spinner {
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top: 3px solid #8b5cf6;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="icons/icon128.png" alt="Argus Logo" class="logo">
        <h2>Completing Authentication...</h2>
        <div class="spinner"></div>
        <p>Please wait while we complete your authentication.</p>
    </div>

    <script>
        (function() {
            try {
                // Get the access token from URL fragment or query parameters
                const urlParams = new URLSearchParams(window.location.hash.substring(1) || window.location.search.substring(1));
                const accessToken = urlParams.get('access_token');
                const error = urlParams.get('error');
                const errorDescription = urlParams.get('error_description');

                if (window.opener) {
                    if (accessToken) {
                        // Send success message to parent window
                        window.opener.postMessage({
                            type: 'OAUTH_SUCCESS',
                            token: accessToken
                        }, window.location.origin);
                    } else if (error) {
                        // Send error message to parent window
                        window.opener.postMessage({
                            type: 'OAUTH_ERROR',
                            error: errorDescription || error || 'OAuth authentication failed'
                        }, window.location.origin);
                    } else {
                        // No token or error found
                        window.opener.postMessage({
                            type: 'OAUTH_ERROR',
                            error: 'No access token received from OAuth provider'
                        }, window.location.origin);
                    }
                    
                    // Close this popup window
                    window.close();
                } else {
                    // No parent window, show error
                    document.querySelector('.container').innerHTML = `
                        <img src="icons/icon128.png" alt="Argus Logo" class="logo">
                        <h2>Authentication Error</h2>
                        <p>This page should have been opened in a popup window. Please try again.</p>
                    `;
                }
            } catch (err) {
                console.error('OAuth redirect error:', err);
                if (window.opener) {
                    window.opener.postMessage({
                        type: 'OAUTH_ERROR',
                        error: 'OAuth redirect handler error: ' + err.message
                    }, window.location.origin);
                    window.close();
                }
            }
        })();
    </script>
</body>
</html>
