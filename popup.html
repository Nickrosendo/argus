<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Argus - Screen Time Tracker</title>
  <link rel="stylesheet" href="css/popup.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <header>
    <div class="logo">
      <img src="icons/icon48.png" alt="Argus Logo">
      <h1>Argus</h1>
    </div>
    <nav>
      <button id="tab-today" class="tab-btn active">Today</button>
      <button id="tab-stats" class="tab-btn">Stats</button>
      <button id="tab-history" class="tab-btn">History</button>
      <button id="tab-settings" class="tab-btn">Settings</button>
    </nav>
  </header>

  <main>
    <!-- Today Tab -->
    <section id="today-section" class="tab-content active">
      <div class="summary-card">
        <h2>Today's Screen Time</h2>
        <div class="total-time" id="total-time-today">0m</div>
        <div class="progress-container">
          <div id="time-progress" class="progress-bar"></div>
        </div>
      </div>

      <div class="sites-container">
        <h3>Most Visited Sites</h3>
        <div id="sites-list" class="sites-list">
          <!-- Sites will be populated here by JS -->
          <div class="loading">Loading data...</div>
        </div>
      </div>
    </section>

    <!-- Stats Tab -->
    <section id="stats-section" class="tab-content">
      <div class="chart-container">
        <canvas id="weekly-chart"></canvas>
      </div>
      <div class="chart-container">
        <canvas id="categories-chart"></canvas>
      </div>
      <div class="stats-highlights">
        <div class="stat-card">
          <h3>Most Used Site</h3>
          <div id="most-used-site">-</div>
        </div>
        <div class="stat-card">
          <h3>Most Productive Day</h3>
          <div id="most-productive-day">-</div>
        </div>
      </div>
    </section>

    <!-- History Tab -->
    <section id="history-section" class="tab-content">
      <div class="date-selector">
        <button id="prev-date" class="nav-arrow">&#8249;</button>
        <span id="selected-date">Today</span>
        <button id="next-date" class="nav-arrow">&#8250;</button>
      </div>
      <div id="history-data" class="history-data">
        <!-- History data will be populated here -->
      </div>
    </section>

    <!-- Settings Tab -->
    <section id="settings-section" class="tab-content">
      <div class="settings-form">
        <div class="setting-item">
          <label for="idle-time">Consider idle after (minutes):</label>
          <input type="number" id="idle-time" min="1" max="60" value="5">
        </div>
        <div class="setting-item">
          <label for="daily-limit">Daily screen time goal (hours):</label>
          <input type="number" id="daily-limit" min="0" max="24" step="0.5" value="8">
        </div>
        <div class="setting-item checkbox">
          <input type="checkbox" id="show-notifications" checked>
          <label for="show-notifications">Show notifications</label>
        </div>
        <div class="setting-item">
          <button id="export-data">Export Data</button>
          <button id="clear-data" class="danger">Clear All Data</button>
        </div>
      </div>
    </section>
  </main>

  <footer>
    <small>Argus - Monitor your screen time</small>
  </footer>

  <!-- Scripts -->
  <script src="js/chart.min.js"></script>
  <script src="js/popup.js"></script>
</body>
</html>
